# Hyprland configuration : Hypridle ------------------------

# General
general {
    lock_cmd = pidof hyprlock || hyprlock
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })'
    ignore_dbus_inhibit = false
    ignore_systemd_inhibit = false
    ignore_wayland_inhibit = false
    inhibit_sleep = 2
}

# Set monitor backlight to minimum, avoid 0 on OLED monitor
listener {
    timeout = 150
    on-timeout = light -O && light -S 5
    on-resume = light -I
}

# Turn off keyboard backlight, comment out this section if you dont have a keyboard backlight.
#listener { 
#    timeout = 150
#    on-timeout = light -s sysfs/leds/platform::kbd_backlight -O && light -s sysfs/leds/platform::kbd_backlight -S 0
#    on-resume = light -s sysfs/leds/platform::kbd_backlight -I
#}

# Lock screen when timeout has passed
listener {
    timeout = 300
    on-timeout = loginctl lock-session
}

# Screen off when timeout has passed
listener {
    timeout = 330
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({ action = "disable" })'
    on-resume = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })' && light -I
}

# Suspend PC
listener {
    timeout = 1200
    on-timeout = systemctl suspend
}
